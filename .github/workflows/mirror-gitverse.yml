name: Mirror to GitVerse
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GV_USER: ${{ secrets.GITVERSE_USER }}
          GV_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          git remote add gitverse "https://${GV_USER}:${GV_TOKEN}@gitverse.ru/SawaDawa177/onelauncher.git"
          git push gitverse HEAD:refs/heads/main --force
